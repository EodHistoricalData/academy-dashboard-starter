# Checks every pull request: no key-shaped string in the tree, and the app's own gates.
#
# Required by the course this starter belongs to, which teaches the checks and then hands
# the learner a repository that did not have them. The git hooks in .githooks/ are the
# first line and are skippable by design; this is the line that is not.
#
# Pull requests only. A push to a branch already ran the same checks in the pre-push hook,
# and a draft is not ready to be checked: it runs when marked ready for review.
name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Every Monday on the default branch, and by hand: a dependency, a runner image or an
  # expired action breaks a tool nobody has committed to. 06:17, because the top of the hour
  # is GitHub's busiest. A schedule runs on the default branch only.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  # A pull request's runs cancel each other; a scheduled or manual run has a group of its own.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # A draft runs nothing; a scheduled or manual run always counts.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history is deliberate. A shallow clone scans only the tip, and a key that
      # arrived three commits ago is exactly the case worth catching.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Invoked through `sh` rather than as `./scripts/key-scan.sh`. The executable bit
      # is set in the index, but a mode bit is a thing that can be lost — by a Windows
      # checkout, by a zip, by a contributor whose core.filemode is off — and this check
      # failing open would be worse than it not existing. It failed exactly this way on
      # its own first run.
      - run: sh scripts/key-scan.sh

  checks:
    # A draft runs nothing; a scheduled or manual run always counts.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # What ships with the app; any finding fails the run. Dev-only findings are triaged in
      # REVIEW.md rather than failing every pull request.
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Builds with a made-up key and fails if its value lands anywhere in the output.
      - run: npm run check:leak
      # The key is read in one file. Any other .ts or .tsx file under src that names it
      # fails the run and is printed. Alone in its step: under `set -e` a failing command
      # negated with `!` does not stop the script, so a line after it would turn this green.
      - name: Key stays in eodhd.ts
        run: |
          ! grep -rn "EODHD_API_KEY" src --include="*.ts*" \
            | grep -v "^src/lib/eodhd.ts:"
