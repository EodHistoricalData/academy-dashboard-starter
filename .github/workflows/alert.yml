# Runs the end-of-day alert on a clock that is not your laptop.
#
# 17:30 in New York on weekdays: NYSE and NASDAQ close at 16:00 and their end-of-day bar is
# ready within 15 minutes. The time zone is named, so the hour holds through both clock
# changes: 21:30 UTC in summer, 22:30 UTC in winter. Off the hour on purpose: the start of
# every hour is when GitHub delays, and sometimes drops, scheduled runs.
#
# A schedule runs only from the default branch, and a fork starts with Actions off: enable
# them in the fork's Actions tab.
#
# Live: each run spends one call per distinct symbol in alerts/rules.json not yet judged
# today, and sends one Telegram message when a rule fires. It needs three repository
# secrets, which you type yourself (`gh secret set NAME`): EODHD_API_KEY,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID. Without them the run fails at its start, naming the
# missing one, before any call.
#
# After every run the job commits alerts/state.json back, so the next run, on a fresh
# machine, knows what was already judged and sent. Pull before you work: main moves.
#
# Then it pings a dead man's switch (Healthchecks.io): success only when the run did its
# work and the state was saved, /fail with the one-line reason otherwise. Silence from this
# job looks exactly like a quiet market, so the check that notices lives outside GitHub.
# Store its ping URL as the HEARTBEAT_URL secret; it is a secret because whoever holds it
# can say all is well. Without it the two steps say so and send nothing.
name: Alert

on:
  schedule:
    # Every weekday at 17:30 New York time, whatever UTC says.
    - cron: "30 17 * * 1-5"
      timezone: "America/New_York"
    # 20:30 New York is 00:30 UTC in summer and 01:30 in winter: after the daily limit
    # resets at midnight GMT, still the same trading day. A run that met a 402 at 17:30
    # gets another go; if the first run worked, this one finds nothing new and spends 0.
    - cron: "30 20 * * 1-5"
      timezone: "America/New_York"
  # A "Run workflow" button, and `gh workflow run alert.yml`.
  workflow_dispatch:

# One alert run at a time. A second one waits for the first instead of cancelling it: a
# run cut off halfway is the one that sends an alert twice, or never.
concurrency:
  group: alert
  cancel-in-progress: false

# Write, to commit alerts/state.json. A push made with the job's own token starts no runs.
permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: plain `npm ci` runs the "prepare" script, which switches on the
      # repository's git hooks, and the state commit below would then run pre-push — the
      # whole test suite and a production build — on every run, and fail to save the state
      # whenever any of it failed. The hooks are for people's commits, not the bot's.
      - run: npm ci --ignore-scripts
      # The secrets go into this step's environment and no other.
      - name: Alert
        run: npm run alert
        env:
          ALERT_DELIVERY: telegram
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Also after a failed run: a half-finished run's record (a key left pending, a symbol
      # already judged) is what stops the next run repeating it. Ids, keys and dates only.
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts/state.json
          git diff --cached --quiet || git commit -m "chore(alert): state after run"
          git push || { echo "state not saved: git push failed" >> alert-outcome.txt; exit 1; }
      # After the state step, never before: a run that failed to save its state must not
      # report success.
      - name: Heartbeat
        if: success()
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then echo "::warning::HEARTBEAT_URL is not set: no heartbeat sent."; exit 0; fi
          curl -fsS -m 10 "$HEARTBEAT_URL"
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
      # The reason as the body: one line, never a token or a price. If the job died before
      # writing it, this ping fails too, and the check still goes down after its grace time.
      - name: Heartbeat, failed
        if: failure()
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then echo "::warning::HEARTBEAT_URL is not set: no failure ping sent."; exit 0; fi
          curl -fsS -m 10 --data-binary @alert-outcome.txt "$HEARTBEAT_URL/fail"
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
